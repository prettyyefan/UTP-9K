[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utp9k"
version = "0.1.0"
description = "Motion-semantic role reasoning for UAV tactile-path perception"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Yefan Wang"},
  {name = "Yusen Wu"},
  {name = "Lingling Qu"},
]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=9.4",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
